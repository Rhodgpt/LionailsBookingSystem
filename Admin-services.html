<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>LioNails - Admin Services</title>
</head>

<body>

    <div class="adminLayout">

        <aside class="adminSidebar">
            <div class="sidebarLogo">
                <h3>LioNails Admin</h3>
            </div>

            <ul class="sidebarMenu">
                <li><a href="Admin-dashboard.html">Dashboard</a></li>
                <li><a href="Admin-booking.html">Bookings</a></li>
                <li><a href="Admin-services.html" class="active">Services</a></li>
                <li><a href="Admin-customers.html">Customers/Clients</a></li>
            </ul>

            <div class="logoutSection">
                <button class="logoutBtn" onclick="logout()">LOGOUT</button>
            </div>
        </aside>

        <main class="adminContent">

            <header class="adminHeader">
                <div>
                    <h1>Services</h1>
                    <p class="adminWelcome">Manage LioNails services and prices.</p>
                </div>

                <button class="filterBtn" type="button" onclick="openServiceModal()">+ ADD SERVICE</button>
            </header>

            <section class="tableSection">
                <h2>Available Services</h2>

                <table class="dataTable">
                    <thead>
                        <tr>
                            <th>Service</th>
                            <th>Description</th>
                            <th>Starting Price</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="servicesTableBody"></tbody>
                </table>
            </section>

            <div id="serviceModal" class="adminModal">
    <div class="adminModalContent">

        <button type="button" class="closeModalBtn" onclick="closeServiceModal()">
            &times;
        </button>

        <h2 id="serviceModalTitle">Add Service</h2>

        <form id="serviceForm">
            <div class="formGroup">
                <label for="serviceName">Service Name</label>
                <input type="text" id="serviceName" required>
                <label for ="serviceImage">Image path<span>(optional)</span></label>
                <input type="text" id="serviceImage"
                Placeholder="images/softgel extention.jpg">
            </div>

            <div class="formGroup">
                <label for="serviceDescription">Description</label>
                <textarea id="serviceDescription" rows="3" required></textarea>
            </div>

            <div class="formGroup">
                <label for="servicePrice">Starting Price</label>
                <input type="text" id="servicePrice" placeholder="e.g., ₱500" required>
            </div>

            <div class="modalActions">
                <button type="button" class="filterBtn" onclick="closeServiceModal()">
                    Cancel
                </button>

                <button type="submit" class="confirmBtn">
                    Save Service
                </button>
            </div>
        </form>

    </div>
</div>

        </main>

    </div>

    <script src="Admin-script.js"></script>

    <script>
        checkLogin();
    </script>

</body>

</html>
