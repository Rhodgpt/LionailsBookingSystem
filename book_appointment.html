<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>LioNails - Book an Appointment</title>
</head>

<body>

    <section class="book_appointPage">
        <div class="topbox">
            <h4>LioNails</h4>

            <div class="navigation">
                <button onclick="location.href='index.html'">HOME</button>
                <button onclick="location.href='view-services.html'">SERVICES</button>
                <button onclick="location.href='about.html'">ABOUT</button>
                <button onclick="location.href='book_appointment.html'">BOOK AN APPOINTMENT</button>
                <button onclick="location.href='contact.html'">CONTACT</button>
            </div>
        </div>
    </section>

    <section class="bookForm">
        <h1>Book an Appointment</h1>
        <p class="formSubtext">Fill out the form below to reserve your time at LioNails.</p>

        <form id="bookingForm">
            <div class="formGrid">

                <div class="formColumn">
                    <div class="formGroup">
                        <label for="clientName">Full Name</label>
                        <input type="text" id="clientName" placeholder="e.g., Jordan Lee" required>
                    </div>

                    <div class="formGroup">
                        <label for="bookingService">Service</label>
                        <select id="bookingService" required>
                            <option value="">loading services...</option>
                        </select>
                    </div>

                    <div class="formGroup">
                        <label for="bookingDate">Preferred Date</label>
                        <input type="date" id="bookingDate" required>
                        <small>Select a date to view available time slots.</small>
                    </div>
                </div>

                <div class="formColumn">
                    <div class="formGroup">
                        <label for="clientPhone">Phone Number</label>
                        <input type="tel" id="clientPhone" placeholder="09XXXXXXXXX" required>
                    </div>

                    <div class="formGroup">
                        <label for="bookingTime">Preferred Time</label>
                        <select id="bookingTime" required disabled>
                            <option value="">Select a date first</option>
                        </select>
                        <small>Booked time slots will not appear in the list.</small>
                    </div>

                    <div class="formGroup">
                        <label for="bookingNotes">Notes <span>(Optional)</span></label>
                        <textarea id="bookingNotes" rows="4"
                            placeholder="Preferred nail shape, design, or other requests"></textarea>
                    </div>
                </div>

            </div>

            <p id="bookingMessage" class="bookingMessage"></p>

            <div class="formButtons">
                <button type="submit" class="confirmBtn">CONFIRM BOOKING</button>
            </div>
        </form>

        <a href="index.html" id="backBtn">← BACK</a>
    </section>

    <script src="script.js"></script>
</body>

</html>
